name: Public synthetic Block on iPad

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: iPad Simulator (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
      - name: Generate synthetic callback source
        run: python3 Scripts/prepare_synthetic_callback.py
      - name: Compile and verify linkage
        run: bash Scripts/ci.sh "${{ matrix.configuration }}"
      - name: Run Demo UI smoke test on iPad
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          options = [(tuple(map(int, runtime.split(".iOS-")[-1].split("-"))), device)
                     for runtime, entries in devices.items()
                     if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-26-")
                     for device in entries
                     if device.get("isAvailable") and device["name"].startswith("iPad")]
          if not options:
              sys.exit("No available iPad simulator with an iOS 26 runtime")
          version, device = max(options, key=lambda option: option[0])
          print("Using {} (iOS {})".format(device["name"], ".".join(map(str, version))), file=sys.stderr)
          print(device["udid"])
          ')"
          xcrun simctl bootstatus "$device_id" -b
          app="$PWD/.build/${{ matrix.configuration }}/Build/Products/${{ matrix.configuration }}-iphonesimulator/ValueTraceExample.app"
          xcrun simctl install "$device_id" "$app"
          xcrun simctl launch "$device_id" org.valuetrace.example
          xcrun simctl terminate "$device_id" org.valuetrace.example
          xcodebuild -project iPadValueTrace.xcodeproj -scheme ValueTraceExample \
            -configuration "${{ matrix.configuration }}" -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$PWD/.build/smoke" -parallel-testing-enabled NO \
            -resultBundlePath "$PWD/.build/PublicBlock.xcresult" \
            test
      - name: Archive simulator test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-ipad-block-${{ matrix.configuration }}
          path: .build/PublicBlock.xcresult
          include-hidden-files: true
          if-no-files-found: warn
